<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<link rel="icon" type="image/x-icon" href="images/favicon.png">
	<title>Caradima Map</title>
	<link href="styles.css" rel="stylesheet"/>
	<script src="main.js" defer></script>
</head>
<body>

<div class="zoom-container" id="container">
	<div class="zoom-graphic" id="graphic">
		<img src="images/vintage_ocean_blank_map.svg" alt="Caradima" class="zoom-element">
		<a href="https://portbeluge.pages.dev/">
			<img src="images/portbeluge.png" style="left: 65%; top:45%; width: 100px; height: 100px; position: absolute"
				 alt="Port Beluge">
		</a>
		<img src="images/meteor.png" style="left: 67%; top:38%; width: 50px; height: 50px; position: absolute"
			 alt="Meteor">
		<img src="images/isle_a.svg" style="left: 87%; top:45%; width: 100px; height: 100px; position: absolute"
			 alt="San Cordera">
		<img src="images/isle_b.svg" style="left: 80%; top:55%; width: 100px; height: 100px; position: absolute"
			 alt="Jhervé">
		<img src="images/vintage_clouds_vector.svg" alt="clouds" class="fade-element cloud zoom-element">
	</div>
</div>
</body>
</html>
